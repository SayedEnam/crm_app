services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-zomzom_crm}
      MYSQL_USER: ${DB_USERNAME:-zomzom}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in the root .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-zomzom_crm}
      DB_USERNAME: ${DB_USERNAME:-zomzom}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_storage:/var/www/html/storage

  api:
    build:
      context: ./backend
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${API_PORT:-8081}:80"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8081/api/v1}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8081}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  mysql_data:
  backend_storage:
